<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050714">

    <title>Two Worlds, One Place</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="stars"></div>

    <main class="app">

        <div class="top">
            <p class="eyebrow">TWO WORLDS</p>
            <h1>One Place</h1>
            <p class="subtitle">
                Different cities. One connection.
            </p>
        </div>

        <section class="universe">

            <div class="earth-wrap">

                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>

                <div class="earth">

                    <div class="earth-glow"></div>

                    <div class="city riyadh">
                        <span class="city-dot"></span>
                        <span class="city-label">Riyadh</span>
                    </div>

                    <div class="city mumbai">
                        <span class="city-dot"></span>
                        <span class="city-label">Mumbai</span>
                    </div>

                    <div class="connection">
                        <span class="pulse"></span>
                    </div>

                </div>

            </div>

        </section>

        <section class="distance-card">

            <div class="location">
                <span class="flag">🇸🇦</span>
                <div>
                    <small>YOUR SIDE</small>
                    <strong>Riyadh</strong>
                </div>
            </div>

            <div class="distance">
                <span>CONNECTED</span>
                <div class="heart">♥</div>
            </div>

            <div class="location right">
                <div>
                    <small>HER SIDE</small>
                    <strong>Mumbai</strong>
                </div>
                <span class="flag">🇮🇳</span>
            </div>

        </section>

        <p class="bottom-message">
            No matter how far apart,
            <span>we're still connected.</span>
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
